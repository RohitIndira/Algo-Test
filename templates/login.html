<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B2C Trading System - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 100%;
            max-width: 450px;
            backdrop-filter: blur(10px);
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo i {
            font-size: 3rem;
            color: #667eea;
            margin-bottom: 10px;
        }
        .logo h2 {
            color: #333;
            font-weight: 700;
            margin: 0;
        }
        .logo p {
            color: #666;
            margin: 5px 0 0 0;
            font-size: 0.9rem;
        }
        .form-control {
            border-radius: 10px;
            border: 2px solid #e9ecef;
            padding: 12px 15px;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .btn-outline-primary {
            border: 2px solid #667eea;
            color: #667eea;
            border-radius: 10px;
            padding: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-outline-primary:hover {
            background: #667eea;
            border-color: #667eea;
            transform: translateY(-1px);
        }
        .alert {
            border-radius: 10px;
            border: none;
        }
        .form-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
        .divider {
            text-align: center;
            margin: 20px 0;
            position: relative;
        }
        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #e9ecef;
        }
        .divider span {
            background: rgba(255, 255, 255, 0.95);
            padding: 0 15px;
            color: #666;
            font-size: 0.9rem;
        }
        .quantity-selector {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .quantity-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid #e9ecef;
            background: white;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .quantity-btn.active {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }
        .quantity-btn:hover {
            border-color: #667eea;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <i class="bi bi-graph-up-arrow"></i>
            <h2>B2C Trading System</h2>
            <p>Multi-User Algorithmic Trading Platform</p>
        </div>

        <!-- Alert Messages -->
        <div id="alertContainer"></div>

        <!-- Login Form -->
        <div id="loginForm">
            <form id="loginFormElement">
                <div class="mb-3">
                    <label for="clientId" class="form-label">
                        <i class="bi bi-person-circle"></i> Client ID
                    </label>
                    <input type="text" class="form-control" id="clientId" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">
                        <i class="bi bi-lock"></i> Password
                    </label>
                    <input type="password" class="form-control" id="password" required>
                </div>
                
                <!-- Quantity Selection -->
                <div class="mb-3">
                    <label class="form-label">
                        <i class="bi bi-stack"></i> Order Quantity
                    </label>
                    <div class="quantity-selector">
                        <div class="quantity-btn active" data-quantity="1">1</div>
                        <div class="quantity-btn" data-quantity="2">2</div>
                        <div class="quantity-btn" data-quantity="3">3</div>
                        <div class="quantity-btn" data-quantity="4">4</div>
                    </div>
                    <input type="hidden" id="selectedQuantity" value="1">
                </div>

                <button type="submit" class="btn btn-primary w-100 mb-3">
                    <i class="bi bi-box-arrow-in-right"></i> Login & Start Trading
                </button>
            </form>

            <div class="divider">
                <span>New User?</span>
            </div>

            <button class="btn btn-outline-primary w-100" onclick="showRegisterForm()">
                <i class="bi bi-person-plus"></i> Create Account
            </button>
        </div>

        <!-- Register Form -->
        <div id="registerForm" style="display: none;">
            <form id="registerFormElement">
                <div class="mb-3">
                    <label for="regClientId" class="form-label">
                        <i class="bi bi-person-circle"></i> Client ID
                    </label>
                    <input type="text" class="form-control" id="regClientId" required>
                </div>
                <div class="mb-3">
                    <label for="regPassword" class="form-label">
                        <i class="bi bi-lock"></i> Password
                    </label>
                    <input type="password" class="form-control" id="regPassword" required>
                </div>
                <div class="mb-3">
                    <label for="regUserName" class="form-label">
                        <i class="bi bi-person"></i> Display Name (Optional)
                    </label>
                    <input type="text" class="form-control" id="regUserName">
                </div>

                <button type="submit" class="btn btn-primary w-100 mb-3">
                    <i class="bi bi-person-plus"></i> Create Account
                </button>
            </form>

            <div class="divider">
                <span>Already have an account?</span>
            </div>

            <button class="btn btn-outline-primary w-100" onclick="showLoginForm()">
                <i class="bi bi-box-arrow-in-right"></i> Back to Login
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Quantity selection
        document.querySelectorAll('.quantity-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.quantity-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                document.getElementById('selectedQuantity').value = this.dataset.quantity;
            });
        });

        // Show alert function
        function showAlert(message, type = 'danger') {
            const alertContainer = document.getElementById('alertContainer');
            alertContainer.innerHTML = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    <i class="bi bi-${type === 'success' ? 'check-circle' : 'exclamation-triangle'}"></i>
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
        }

        // Form switching
        function showRegisterForm() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
        }

        function showLoginForm() {
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('loginForm').style.display = 'block';
        }

        // Login form submission
        document.getElementById('loginFormElement').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const clientId = document.getElementById('clientId').value;
            const password = document.getElementById('password').value;
            const quantity = document.getElementById('selectedQuantity').value;
            
            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        client_id: clientId,
                        password: password,
                        order_quantity: parseInt(quantity)
                    })
                });
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    // Update user config with selected quantity
                    await fetch('/api/user/config', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            order_quantity: parseInt(quantity)
                        })
                    });
                    
                    showAlert('Login successful! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 1500);
                } else {
                    showAlert(data.message);
                }
            } catch (error) {
                showAlert('Login failed. Please try again.');
            }
        });

        // Register form submission
        document.getElementById('registerFormElement').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const clientId = document.getElementById('regClientId').value;
            const password = document.getElementById('regPassword').value;
            const userName = document.getElementById('regUserName').value;
            
            try {
                const response = await fetch('/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        client_id: clientId,
                        password: password,
                        user_name: userName
                    })
                });
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    showAlert('Account created successfully! Please login.', 'success');
                    setTimeout(() => {
                        showLoginForm();
                        document.getElementById('clientId').value = clientId;
                    }, 1500);
                } else {
                    showAlert(data.message);
                }
            } catch (error) {
                showAlert('Registration failed. Please try again.');
            }
        });
    </script>
</body>
</html>
